name: Fire TV Release

on:
  push:
    tags:
      - "firetv-v*"

permissions:
  contents: write

concurrency:
  group: firetv-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'tnichol00/PiStick'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        env:
          FIRETV_KEYSTORE_BASE64: ${{ secrets.FIRETV_KEYSTORE_BASE64 }}
        run: |
          test -n "$FIRETV_KEYSTORE_BASE64"
          printf '%s' "$FIRETV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/firetv-release.jks"
      - name: Verify source and build signed release
        working-directory: android
        env:
          FIRETV_KEYSTORE_PATH: ${{ runner.temp }}/firetv-release.jks
          FIRETV_KEYSTORE_PASSWORD: ${{ secrets.FIRETV_KEYSTORE_PASSWORD }}
          FIRETV_KEY_ALIAS: ${{ secrets.FIRETV_KEY_ALIAS }}
          FIRETV_KEY_PASSWORD: ${{ secrets.FIRETV_KEY_PASSWORD }}
        run: |
          scripts/verify_firetv.sh
          ./gradlew --no-daemon --stacktrace verifyFireTvReleaseSigning testReleaseUnitTest lintRelease assembleRelease
      - name: Verify and name release APK
        id: apk
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${TAG_NAME#firetv-v}"
          [[ "$TAG_NAME" == "firetv-v$tag_version" && "$tag_version" =~ ^[1-9][0-9]*$ ]]
          metadata="android/app/build/outputs/apk/release/output-metadata.json"
          apk="android/app/build/outputs/apk/release/app-release.apk"
          built_version="$(jq -r '.elements[0].versionCode' "$metadata")"
          test "$built_version" = "$tag_version"
          android/scripts/verify_firetv.sh "$apk"
          asset="android/PiStick-Fire-TV-v${built_version}.apk"
          install -m 0644 "$apk" "$asset"
          printf 'asset=%s\n' "$asset" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$built_version" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.apk.outputs.asset }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "$ASSET#PiStick Fire TV APK"
          --verify-tag --generate-notes --title "PiStick Fire TV v$VERSION"
