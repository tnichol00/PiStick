name: iOS checks

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-*.yml"
  push:
    branches:
      - agent/ios-standalone
    paths:
      - "ios/**"
      - ".github/workflows/ios-*.yml"

permissions:
  contents: read

concurrency:
  group: ios-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out PiStick
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Check bundled JavaScript
        run: node --check ios/PiStick/Resources/Web/app.js

      - name: Check Fastlane configuration
        run: |
          ruby -c ios/fastlane/Appfile
          ruby -c ios/fastlane/Fastfile

      - name: Build and test iPhone target
        working-directory: ios
        run: >-
          set -o pipefail &&
          xcodebuild
          -project PiStick.xcodeproj
          -scheme PiStick
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO
          clean test
          | xcbeautify

      - name: Build iPad target
        working-directory: ios
        run: >-
          set -o pipefail &&
          xcodebuild
          -project PiStick.xcodeproj
          -scheme PiStick
          -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=latest'
          CODE_SIGNING_ALLOWED=NO
          build
          | xcbeautify

      - name: Archive and verify bundled resources
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PiStick.xcodeproj \
            -scheme PiStick \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/PiStick.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive \
            | xcbeautify
          (
            cd fastlane
            bash ../scripts/verify_app_bundle.sh \
              "../build/PiStick.xcarchive/Products/Applications/PiStick.app"
          )
