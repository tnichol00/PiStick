plugins {
    id "com.android.application"
}

def fireTvKeystorePath = System.getenv("FIRETV_KEYSTORE_PATH")
def fireTvKeystorePassword = System.getenv("FIRETV_KEYSTORE_PASSWORD")
def fireTvKeyAlias = System.getenv("FIRETV_KEY_ALIAS")
def fireTvKeyPassword = System.getenv("FIRETV_KEY_PASSWORD")
def fireTvReleaseSigningConfigured = [
        fireTvKeystorePath,
        fireTvKeystorePassword,
        fireTvKeyAlias,
        fireTvKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace "app.pistick.android"
    compileSdk 36

    defaultConfig {
        applicationId "app.pistick.firetv"
        minSdk 25
        targetSdk 36
        versionCode 3
        versionName "1.0.2-firetv"

        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (fireTvReleaseSigningConfigured) {
            fireTvRelease {
                storeFile file(fireTvKeystorePath)
                storePassword fireTvKeystorePassword
                keyAlias fireTvKeyAlias
                keyPassword fireTvKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (fireTvReleaseSigningConfigured) {
                signingConfig signingConfigs.fireTvRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.register("verifyFireTvReleaseSigning") {
    doLast {
        if (!fireTvReleaseSigningConfigured) {
            throw new GradleException("The four FIRETV release-signing environment variables are required.")
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
