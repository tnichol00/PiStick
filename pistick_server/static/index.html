<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>PiStick</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header id="site-header" class="site-header hidden">
    <button id="brand-button" class="brand" type="button" aria-label="PiStick home">PISTICK</button>
    <nav class="main-nav" aria-label="Main navigation">
      <button class="nav-button active" type="button" data-view="home">Home</button>
      <button class="nav-button" type="button" data-view="movie">Movies</button>
      <button class="nav-button" type="button" data-view="tv">TV Shows</button>
    </nav>
    <form id="search-form" class="search-form" role="search">
      <label class="sr-only" for="search-input">Search movies and TV shows</label>
      <input id="search-input" type="search" maxlength="120" autocomplete="off" placeholder="Search">
    </form>
    <button id="profile-button" class="profile-button" type="button">Profiles</button>
    <button id="settings-button" class="icon-button" type="button" aria-label="Settings" title="Settings">⚙</button>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <dialog id="details-dialog" class="details-dialog">
    <button id="details-close" class="round-close" type="button" aria-label="Close details">×</button>
    <div id="details-content"></div>
  </dialog>

  <dialog id="settings-dialog" class="settings-dialog">
    <form id="settings-form" method="dialog">
      <div class="dialog-heading-row">
        <div>
          <p class="eyebrow">SERVER SETTINGS</p>
          <h2>TMDB connection</h2>
        </div>
        <button id="settings-close" class="round-close static-close" type="button" aria-label="Close settings">×</button>
      </div>
      <p class="muted">Your TMDB Read Access Token stays in PiStick Server's private data folder. It is never sent to this browser after being saved.</p>
      <label class="field-label" for="tmdb-token">TMDB API Read Access Token</label>
      <textarea id="tmdb-token" rows="4" spellcheck="false" autocomplete="off" placeholder="Paste the long token beginning with eyJ..."></textarea>
      <p id="settings-message" class="form-message" role="status"></p>
      <button id="save-settings" class="primary-button full-button" type="submit">Validate and save</button>
    </form>
  </dialog>

  <dialog id="keyboard-dialog" class="keyboard-dialog">
    <div class="dialog-heading-row">
      <div>
        <p class="eyebrow">CONTROLLER KEYBOARD</p>
        <h2 id="keyboard-title">Enter text</h2>
      </div>
      <button id="keyboard-close" class="round-close static-close" type="button" aria-label="Close keyboard">×</button>
    </div>
    <input id="keyboard-value" class="keyboard-value" type="text" maxlength="120" readonly aria-label="Entered text">
    <div id="keyboard-grid" class="keyboard-grid" aria-label="On-screen keyboard"></div>
  </dialog>

  <section id="player-overlay" class="player-overlay hidden" aria-label="Player">
    <div class="player-toolbar">
      <div>
        <p class="eyebrow">NOW PLAYING</p>
        <h2 id="player-title">PiStick</h2>
      </div>
      <div class="player-actions">
        <button id="player-fullscreen" class="secondary-button" type="button">Fullscreen</button>
        <button id="player-close" class="round-close static-close" type="button" aria-label="Close player">×</button>
      </div>
    </div>
    <div class="player-frame-wrap">
      <iframe id="player-frame" title="PiStick player" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
    <div class="controller-hint">Controller: A play/pause · B back · X subtitles · Left/Right seek</div>
  </section>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
