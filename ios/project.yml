name: PiStick
options:
  bundleIdPrefix: app.pistick
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  PiStick:
    type: application
    platform: iOS
    sources:
      - path: PiStick
        excludes:
          - Resources
      - path: PiStick/Resources/Assets.xcassets
        buildPhase: resources
      - path: PiStick/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: PiStick/Resources/Web/index.html
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Web
      - path: PiStick/Resources/Web/app.js
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Web
      - path: PiStick/Resources/Web/styles.css
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Web
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pistick.PiStick
        PRODUCT_NAME: PiStick
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PiStick/Info.plist
  PiStickTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PiStickTests
    dependencies:
      - target: PiStick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pistick.PiStickTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PiStick:
    build:
      targets:
        PiStick: all
        PiStickTests: [test]
    test:
      targets:
        - PiStickTests
      gatherCoverageData: true
